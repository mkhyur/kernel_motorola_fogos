name: Build fogos - KernelSU Next No SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ARCH: arm64
      OUT: out
      STOCK_CONFIG: arch/arm64/configs/vendor/fogos_stock-config
      FOGOS_CONFIG: arch/arm64/configs/vendor/ext_config/moto-holi-fogos.config
      KSU_REPO: https://github.com/KernelSU-Next/KernelSU-Next.git
      KSU_BRANCH: legacy

    steps:
      - name: Checkout fogos kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential curl flex git \
            libelf-dev libssl-dev python3 unzip zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup KernelSU Next
        shell: bash
        run: |
          set -e

          rm -rf KernelSU-Next drivers/kernelsu

          git clone --depth=1 --single-branch \
            --branch "${KSU_BRANCH}" \
            "${KSU_REPO}" KernelSU-Next

          test -f KernelSU-Next/kernel/Kconfig
          test -f KernelSU-Next/kernel/Kbuild

          ln -s ../KernelSU-Next/kernel drivers/kernelsu

          echo "KernelSU commit:"
          git -C KernelSU-Next log -1 --oneline

      - name: Install clang toolchain
        shell: bash
        run: |
          set -e

          mkdir clang
          curl -L \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-qpr3-release/clang-r383902b1.tar.gz \
            -o clang.tar.gz

          tar -xzf clang.tar.gz -C clang

          echo "$PWD/clang/bin" >> $GITHUB_PATH

          clang --version

      - name: Configure kernel
        shell: bash
        run: |
          set -e

          rm -rf "${OUT}"
          mkdir "${OUT}"

          scripts/kconfig/merge_config.sh -m \
            -O "${OUT}" \
            "${STOCK_CONFIG}" \
            "${FOGOS_CONFIG}"

          make O="${OUT}" \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

          scripts/config --file "${OUT}/.config" -e KSU
          scripts/config --file "${OUT}/.config" -e KSU_MANUAL_HOOK
          scripts/config --file "${OUT}/.config" -d KSU_KPROBES_HOOK

          # Remove all SUSFS support
          scripts/config --file "${OUT}/.config" -d KSU_SUSFS

          make O="${OUT}" \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

          grep -qx 'CONFIG_KSU=y' "${OUT}/.config"

          if grep -q 'CONFIG_KSU_SUSFS=y' "${OUT}/.config"; then
            echo "ERROR: SUSFS still enabled"
            exit 1
          fi

          cp "${OUT}/.config" final-config

      - name: Build Image
        shell: bash
        run: |
          set -e

          make -j$(nproc) \
            O="${OUT}" \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image

          test -s "${OUT}/arch/arm64/boot/Image"

      - name: Create AnyKernel3 ZIP
        shell: bash
        run: |
          set -e

          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git AnyKernel3

          cp "${OUT}/arch/arm64/boot/Image" AnyKernel3/Image

          python3 - <<'PY'
          from pathlib import Path
          p = Path("AnyKernel3/anykernel.sh")
          s = p.read_text()
          s = s.replace(
              "block=/dev/block/bootdevice/by-name/boot;",
              "BLOCK=boot;"
          )
          s = s.replace(
              "is_slot_device=1;",
              "IS_SLOT_DEVICE=auto;"
          )
          p.write_text(s)
          PY

          chmod 755 AnyKernel3/anykernel.sh

          cd AnyKernel3
          zip -r9 ../fogos-KernelSU-Next-No-SUSFS-AnyKernel3.zip . \
            -x '*.git*' README.md

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fogos-KernelSU-Next-No-SUSFS
          path: |
            fogos-KernelSU-Next-No-SUSFS-AnyKernel3.zip
            final-config
