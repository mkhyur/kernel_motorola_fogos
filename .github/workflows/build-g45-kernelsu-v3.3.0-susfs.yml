name: Build fogos - Stable KSUN + SUSFS + Meta Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ARCH: arm64
      SUBARCH: arm64
      OUT: out
      STOCK_CONFIG: arch/arm64/configs/vendor/fogos_stock-config
      FOGOS_CONFIG: arch/arm64/configs/vendor/ext_config/moto-holi-fogos.config

      # Fixed official KernelSU Next legacy release.
      KSU_REPO: https://github.com/KernelSU-Next/KernelSU-Next.git
      KSU_REF: v3.2.0-legacy

      # Android clang matching this Motorola 5.4 generation.
      CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-qpr3-release/clang-r383902b1.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail

          # ------------------------------------------------------------
          # 1. Dependencies
          # ------------------------------------------------------------
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential curl flex git \
            libelf-dev libssl-dev libncurses-dev \
            python3 unzip zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

          # ------------------------------------------------------------
          # 2. Basic source validation
          # ------------------------------------------------------------
          test -f "${STOCK_CONFIG}"
          test -f "${FOGOS_CONFIG}"
          test -f fs/susfs.c
          test -f include/linux/susfs.h
          grep -q "SUSFS" fs/Kconfig
          grep -qi "susfs" fs/Makefile

          # ------------------------------------------------------------
          # 3. Official KernelSU Next - fixed legacy release
          # ------------------------------------------------------------
          rm -rf KernelSU-Next drivers/kernelsu

          git clone -q --depth=1 \
            --branch "${KSU_REF}" \
            "${KSU_REPO}" KernelSU-Next

          ln -s ../KernelSU-Next/kernel drivers/kernelsu

          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Kbuild

          # ------------------------------------------------------------
          # 4. Toolchain
          # ------------------------------------------------------------
          mkdir -p clang
          curl -fL --retry 5 --retry-delay 3 \
            "${CLANG_URL}" -o clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          rm -f clang.tar.gz

          export PATH="$PWD/clang/bin:$PATH"

          clang --version
          aarch64-linux-gnu-gcc --version | head -1

          # ------------------------------------------------------------
          # 5. Motorola IKCONFIG compatibility fix
          # ------------------------------------------------------------
          if grep -Fq \
            '$(obj)/config_data: arch/arm64/configs/vendor/fogos_stock-config FORCE' \
            kernel/Makefile; then

            sed -i \
              's#$(obj)/config_data: arch/arm64/configs/vendor/fogos_stock-config FORCE#$(obj)/config_data: $(KCONFIG_CONFIG) FORCE#' \
              kernel/Makefile
          fi

          # ------------------------------------------------------------
          # 6. Kernel configuration
          # ------------------------------------------------------------
          rm -rf "${OUT}"
          mkdir -p "${OUT}"

          # Remove duplicate CONFIG entries from Motorola fragment.
          python3 - "${FOGOS_CONFIG}" "$RUNNER_TEMP/fogos.config" <<'PY'
          import re, sys
          from pathlib import Path

          src = Path(sys.argv[1]).read_text(errors="ignore").splitlines()
          dst = Path(sys.argv[2])

          rx = re.compile(
              r'^(?:#\s*)?CONFIG_([A-Za-z0-9_]+)(?:=|\s+is not set)'
          )

          seen = set()
          result = []

          for line in reversed(src):
              m = rx.match(line)
              if m:
                  if m.group(1) in seen:
                      continue
                  seen.add(m.group(1))
              result.append(line)

          dst.write_text("\n".join(reversed(result)) + "\n")
          PY

          scripts/kconfig/merge_config.sh -m -O "$PWD/${OUT}" \
            "${STOCK_CONFIG}" \
            "$RUNNER_TEMP/fogos.config"

          make O="${OUT}" \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

          # KernelSU Next integrated into kernel.
          scripts/config --file "${OUT}/.config" -e KSU
          scripts/config --file "${OUT}/.config" -e KSU_MANUAL_HOOK
          scripts/config --file "${OUT}/.config" -d KSU_KPROBES_HOOK

          # SUSFS core.
          scripts/config --file "${OUT}/.config" -e KSU_SUSFS

          # Required runtime features for systemless modules / Magic Mount-rs.
          scripts/config --file "${OUT}/.config" -e NAMESPACES
          scripts/config --file "${OUT}/.config" -e PID_NS
          scripts/config --file "${OUT}/.config" -e IPC_NS
          scripts/config --file "${OUT}/.config" -e UTS_NS
          scripts/config --file "${OUT}/.config" -e NET_NS
          scripts/config --file "${OUT}/.config" -e TMPFS
          scripts/config --file "${OUT}/.config" -e TMPFS_POSIX_ACL
          scripts/config --file "${OUT}/.config" -e TMPFS_XATTR

          # Meta Module compatibility.
          # Keeps KernelSU Next metamodules such as meta-overlayfs usable.
          scripts/config --file "${OUT}/.config" -e OVERLAY_FS

          # Enable every SUSFS option actually provided by this source.
          python3 - "${OUT}/.config" <<'PY'
          import re, subprocess, sys
          from pathlib import Path

          config = sys.argv[1]
          symbols = set()

          for root in [Path("KernelSU-Next/kernel"), Path("fs/Kconfig")]:
              files = [root] if root.is_file() else root.rglob("*")
              for p in files:
                  if not p.is_file():
                      continue
                  try:
                      data = p.read_text(errors="ignore")
                  except Exception:
                      continue

                  for s in re.findall(
                      r'^\s*config\s+(KSU_SUSFS(?:_[A-Za-z0-9_]+)?)\s*$',
                      data,
                      re.M,
                  ):
                      symbols.add(s)

          symbols.discard("KSU_SUSFS")

          for symbol in sorted(symbols):
              subprocess.run(
                  ["scripts/config", "--file", config, "-e", symbol],
                  check=True,
              )
          PY

          make O="${OUT}" \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

          # Stop before compiling if essential settings disappeared.
          grep -qx 'CONFIG_KSU=y' "${OUT}/.config"
          grep -qx 'CONFIG_KSU_MANUAL_HOOK=y' "${OUT}/.config"
          grep -qx 'CONFIG_KSU_SUSFS=y' "${OUT}/.config"
          grep -qx 'CONFIG_NAMESPACES=y' "${OUT}/.config"
          grep -qx 'CONFIG_TMPFS=y' "${OUT}/.config"
          grep -qx 'CONFIG_OVERLAY_FS=y' "${OUT}/.config"

          echo "======== FINAL KSU / SUSFS CONFIG ========"
          grep -E \
            '^(CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_KSU_SUSFS|CONFIG_NAMESPACES=|CONFIG_TMPFS|CONFIG_OVERLAY_FS=)' \
            "${OUT}/.config" | sort || true

          # ------------------------------------------------------------
          # 7. Compile
          # ------------------------------------------------------------
          make -j"$(nproc)" O="${OUT}" \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image 2>&1 | tee build.log

          IMAGE="${OUT}/arch/arm64/boot/Image"
          test -s "${IMAGE}"

          # ------------------------------------------------------------
          # 8. AnyKernel3
          # ------------------------------------------------------------
          git clone -q --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git AnyKernel3

          rm -rf AnyKernel3/.git
          cp "${IMAGE}" AnyKernel3/Image

          cat > AnyKernel3/anykernel.sh <<'AK3'
          # AnyKernel3 - Motorola fogos
          # KernelSU Next + SUSFS

          properties() { '
          kernel.string=fogos KernelSU Next + SUSFS
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=fogos
          '; }

          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=1;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          AK3

          chmod 755 AnyKernel3/anykernel.sh

          (
            cd AnyKernel3
            zip -qr9 ../fogos-KSUN-SUSFS-MetaModule-AnyKernel3.zip . \
              -x '*.git*' 'README.md' '*placeholder'
          )

          test -s fogos-KSUN-SUSFS-MetaModule-AnyKernel3.zip
          cp "${OUT}/.config" fogos-final.config

          echo "======== BUILD OK ========"
          ls -lh fogos-KSUN-SUSFS-MetaModule-AnyKernel3.zip
          sha256sum fogos-KSUN-SUSFS-MetaModule-AnyKernel3.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fogos-KSUN-SUSFS-MetaModule
          path: |
            fogos-KSUN-SUSFS-MetaModule-AnyKernel3.zip
            fogos-final.config
            build.log
          retention-days: 14
