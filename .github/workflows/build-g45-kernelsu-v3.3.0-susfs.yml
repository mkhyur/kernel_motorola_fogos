name: Build fogos - KernelSU Next Pure

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      OUT: out
      ARCH: arm64
      STOCK_CONFIG: arch/arm64/configs/vendor/fogos_stock-config
      FOGOS_CONFIG: arch/arm64/configs/vendor/ext_config/moto-holi-fogos.config

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential curl flex git \
            libelf-dev libssl-dev python3 unzip zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: KernelSU Next
        run: |
          set -e
          rm -rf KernelSU-Next drivers/kernelsu

          git clone --depth=1 --branch legacy \
            https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next

          test -f KernelSU-Next/kernel/Kconfig
          test -f KernelSU-Next/kernel/Kbuild

          ln -s ../KernelSU-Next/kernel drivers/kernelsu

          git -C KernelSU-Next log -1 --oneline

      - name: Clang toolchain
        run: |
          set -e

          mkdir clang

          curl -L \
          https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-qpr3-release/clang-r383902b1.tar.gz \
          -o clang.tar.gz

          tar -xzf clang.tar.gz -C clang

          echo "$PWD/clang/bin" >> $GITHUB_PATH

          clang --version

      - name: Configure
        run: |
          set -e

          rm -rf "${OUT}"
          mkdir "${OUT}"

          scripts/kconfig/merge_config.sh -m \
            -O "${OUT}" \
            "${STOCK_CONFIG}" \
            "${FOGOS_CONFIG}"

          make O="${OUT}" \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

          scripts/config --file "${OUT}/.config" -e KSU
          scripts/config --file "${OUT}/.config" -e KSU_MANUAL_HOOK
          scripts/config --file "${OUT}/.config" -d KSU_KPROBES_HOOK
          scripts/config --file "${OUT}/.config" -d KSU_SUSFS

          make O="${OUT}" \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

          grep -qx 'CONFIG_KSU=y' "${OUT}/.config"

          if grep -q 'CONFIG_KSU_SUSFS=y' "${OUT}/.config"; then
            echo "ERROR: SUSFS enabled"
            exit 1
          fi

          cp "${OUT}/.config" final-config

      - name: Compile Image
        run: |
          set -e

          make -j$(nproc) \
            O="${OUT}" \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image

          test -s "${OUT}/arch/arm64/boot/Image"

      - name: AnyKernel3
        run: |
          set -e

          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git AnyKernel3

          cp "${OUT}/arch/arm64/boot/Image" AnyKernel3/Image

          cat > AnyKernel3/anykernel.sh <<'AK'
          #!/system/bin/sh

          properties() { '
          kernel.string=Motorola fogos KernelSU Next Pure
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=fogos
          device.name2=generic
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;

          exit 0;
          AK

          chmod 755 AnyKernel3/anykernel.sh

          cd AnyKernel3
          zip -r9 ../fogos-KernelSU-Next-Pure-AnyKernel3.zip . \
            -x '*.git*' README.md

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fogos-KernelSU-Next-Pure
          path: |
            fogos-KernelSU-Next-Pure-AnyKernel3.zip
            final-config
